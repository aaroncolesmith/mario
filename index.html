<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Super Mario Bros. — World 1-1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  #tc{display:none;position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    justify-content:space-between;align-items:flex-end;pointer-events:none}
  #tc .grp{display:flex;gap:10px;pointer-events:auto}
  #tc button{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.15);color:#fff;font:14px 'Press Start 2P',monospace;touch-action:none}
  #tc button.on{background:rgba(255,255,255,.45)}
  #tc .ab button{background:rgba(216,40,0,.45)}
  #tc .ab button.on{background:rgba(216,40,0,.8)}
  #tc .ab button[data-k=jump]{margin-bottom:28px}
  #prize{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.85);opacity:0;pointer-events:none;transition:opacity 1.5s ease}
  #prize.show{opacity:1;pointer-events:auto}
  #prize{flex-direction:column;justify-content:flex-start;gap:16px;padding:0 0 16px;box-sizing:border-box}
  #banner{width:100%;background:#000;color:#fcfcfc;text-align:center;font:clamp(10px,2.6vw,20px)/1.6 'Press Start 2P',monospace;
    padding:calc(14px + env(safe-area-inset-top)) 16px 14px;box-sizing:border-box;border-bottom:4px solid #c84c0c}
  #banner .big{color:#fc9838;font-size:1.3em}
  #prize img{max-width:92vw;max-height:calc(100vh - 170px);margin:auto;border:4px solid #fcfcfc;box-shadow:0 0 0 4px #c84c0c;image-rendering:auto}
  #gate{position:fixed;inset:0;z-index:10;background:#000;display:flex;flex-direction:column;gap:18px;
    align-items:center;justify-content:center;font:12px 'Press Start 2P',monospace;color:#fcfcfc;padding:16px;text-align:center}
  #gate[hidden]{display:none}
  #gate input,#gate button{font:inherit;padding:10px 12px;border:3px solid #fcfcfc;background:#000;color:#fcfcfc;
    text-align:center;width:min(260px,80vw);box-sizing:border-box}
  #gate button{background:#c84c0c;cursor:pointer}
  #gate .err{color:#fc9838;min-height:1em}
  @media (pointer:coarse){
    #tc{display:flex}
    @media (orientation:portrait){#wrap{align-items:flex-start;padding-top:env(safe-area-inset-top)}}
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="256" height="240"></canvas></div>
<form id="gate">
  <div>ENTER PASSWORD</div>
  <input id="pw" type="password" autocomplete="current-password" autofocus>
  <button type="submit">START</button>
  <div class="err" id="pwerr"></div>
</form>
<div id="prize"><div id="banner"><div class="big" id="bannerName"></div><div>NEXT LEVEL COMING MAY 2027</div></div><img id="prizeImg" alt=""></div>
<div id="tc">
  <div class="grp"><button data-k="left">&#9664;</button><button data-k="down">&#9660;</button><button data-k="right">&#9654;</button></div>
  <div class="grp ab"><button data-k="run">B</button><button data-k="jump">A</button></div>
</div>

'use strict';
// =====================================================================
//  Super Mario Bros. World 1-1 tribute — single-file canvas game
// =====================================================================
const W = 256, H = 240, T = 16, LW = 212, LH = 15;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ---------------------------------------------------------------- display
function resize() {
  const touch = matchMedia('(pointer:coarse)').matches;
  const portrait = innerHeight > innerWidth;
  const availH = touch && !portrait ? innerHeight : innerHeight - (touch ? 110 : 0);
  let s = Math.min(innerWidth / W, availH / H);
  if (s >= 2 && !touch) s = Math.floor(s);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- input
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowDown:'down', KeyS:'down',
  ArrowUp:'jump', KeyW:'jump', Space:'jump', KeyX:'jump', KeyK:'jump',
  KeyZ:'run', KeyJ:'run', ShiftLeft:'run', ShiftRight:'run', Enter:'start', KeyP:'start'
};
const ACTIONS = ['left','right','down','jump','run','start'];
const keys = {}, touchKeys = {}, input = {}, prevIn = {};
let locked = true;
async function unlock(pw) {
  const buf = new Uint8Array(await (await fetch('prize.bin')).arrayBuffer());
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: buf.slice(0, 16), iterations: 200000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const img = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(16, 28) }, key, buf.slice(28));
  document.getElementById('prizeImg').src = URL.createObjectURL(new Blob([img], { type: 'image/jpeg' }));
  locked = false; document.getElementById('gate').hidden = true;
  try { localStorage.setItem('smb11_pw', pw); } catch (e) {}
}
document.getElementById('gate').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('pwerr'); err.textContent = '...';
  try { await unlock(document.getElementById('pw').value.trim()); audio(); }
  catch (x) { err.textContent = 'WRONG PASSWORD'; }
});
try { const saved = localStorage.getItem('smb11_pw'); if (saved) unlock(saved).catch(() => {}); } catch (e) {}
addEventListener('keydown', e => {
  if (locked) return;
  audio();
  if (e.code === 'KeyM') { muted = !muted; return; }
  const a = KEYMAP[e.code]; if (a) { keys[a] = true; e.preventDefault(); }
});
addEventListener('keyup', e => { if (locked) return; const a = KEYMAP[e.code]; if (a) { keys[a] = false; e.preventDefault(); } });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('#tc button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); audio(); touchKeys[k] = true; b.classList.add('on'); };
  const off = e => { e.preventDefault(); touchKeys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
let canvasTap = false, prizeTap = false;
document.getElementById('prize').addEventListener('pointerdown', () => { if (game.prize > 360) prizeTap = true; });
let tapX = 0, tapY = 0;
cv.addEventListener('pointerdown', e => {
  audio(); canvasTap = true;
  const r = cv.getBoundingClientRect();
  tapX = (e.clientX - r.left) / r.width * W; tapY = (e.clientY - r.top) / r.height * H;
});
function readInput() {
  for (const a of ACTIONS) {
    const h = !!(keys[a] || touchKeys[a]);
    input[a] = h; input[a + 'P'] = h && !prevIn[a];
  }
  input.tapP = canvasTap; canvasTap = false;
  if (prizeTap && game.state !== 'play') prizeTap = false;
}
function endInput() { for (const a of ACTIONS) prevIn[a] = input[a]; }

// ---------------------------------------------------------------- audio
let AC = null, muted = false, noiseBuf = null;
function audio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state === 'suspended') AC.resume();
}
function tone(f, d, o = {}) {
  if (!AC || muted) return;
  const t = AC.currentTime + (o.at || 0);
  const osc = AC.createOscillator(), g = AC.createGain();
  osc.type = o.type || 'square';
  osc.frequency.setValueAtTime(f, t);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d);
  const v = o.vol || 0.05;
  g.gain.setValueAtTime(v, t);
  g.gain.setValueAtTime(v, t + d * 0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  osc.connect(g).connect(AC.destination);
  osc.start(t); osc.stop(t + d + 0.02);
}
function seq(notes, step, o = {}) { notes.forEach((f, i) => { if (f) tone(f, step * 0.95, { ...o, at: (o.at || 0) + i * step }); }); }
function noise(d, vol) {
  if (!AC || muted) return;
  const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = 1800;
  g.gain.setValueAtTime(vol, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
  s.connect(f).connect(g).connect(AC.destination); s.start(); s.stop(AC.currentTime + d);
}

    const tx = Math.floor((e.x + e.w - 1) / T);

  } else if (e.vx < 0) {
    const tx = Math.floor(e.x / T);

  if (m.x < camX) { m.x = camX; if (m.vx < 0) m.vx = 0; }
  const hit = physY(m, true);
  if (hit) {
    const cx = m.x + m.w / 2;
    let best = hit.hits[0], bd = 1e9;
    for (const tx of hit.hits) { const d = Math.abs(tx * T + 8 - cx); if (d < bd) { bd = d; best = tx; } }
    bumpTile(best, hit.ty);
    m.jumping = false;
  }
  if (m.onGround) m.combo = 0;
  // animation
  if (m.onGround) m.anim = m.vx === 0 ? 0 : m.anim + Math.abs(m.vx) * 0.12;
  // pit
  if (m.y > H + 8) die(true);
  // flagpole
  if (m.x + m.w >= POLE_X - 1 && m.y < 12 * T) grabFlag();
}

function grabFlag() {
  const m = M;
  m.state = 'flag'; m.t = 0; m.flipT = 0; m.vx = 0; m.vy = 0; m.crouch = false;
  if (m.power > 0) m.h = 32;
  m.x = POLE_X - m.w + 1; m.facing = 1;
  const y = m.y + m.h;
  const pts = y < 64 ? 5000 : y < 96 ? 2000 : y < 128 ? 800 : y < 160 ? 400 : 100;
  addScore(pts, POLE_X + 6, m.y);
  SFX.flag();
}

function die(pit) {
  if (M.state === 'dead') return;
  M.state = 'dead'; M.t = 0; M.pit = !!pit; M.vx = 0; M.vy = -4.5; M.power = 0; M.star = 0;
  SFX.die();
}
function loseLife() {
  game.lives--;
  if (game.lives <= 0) { saveHi(); game.state = 'gameover'; game.timer = 300; SFX.over(); }
  else startIntro();
}
function hurt() {
  if (M.invuln > 0 || M.star > 0 || M.state !== 'normal') return;
  if (M.power > 0) {
    M.power = 0; M.crouch = false; setH(16); M.invuln = 120; freeze('shrink', 50); SFX.shrink();
  } else die(false);
}

function bumpTile(tx, ty) {
  const c = tileAt(tx, ty), key = tx + ',' + ty, what = contents[key];
  let bumped = false;
  if (c === '?' || c === 'H') {
    giveContent(what || 'coin', tx, ty);
    map[ty][tx] = 'U'; bumped = true;
  } else if (c === 'B') {
    if (what === 'coins') {
      if (contents[key + 'n'] === undefined) contents[key + 'n'] = 10;
      giveContent('coin', tx, ty);
      if (--contents[key + 'n'] <= 0) map[ty][tx] = 'U';
      bumped = true;
    } else if (what) {
      giveContent(what, tx, ty); map[ty][tx] = 'U'; bumped = true;
    } else if (M.power > 0) {
      map[ty][tx] = ' ';
      const bx = tx * T, by = ty * T;
      parts.push({ x: bx, y: by, vx: -1, vy: -6 }, { x: bx + 8, y: by, vx: 1, vy: -6 },
                 { x: bx, y: by + 8, vx: -1, vy: -4 }, { x: bx + 8, y: by + 8, vx: 1, vy: -4 });
      addScore(50); SFX.brick();
    } else { bumped = true; SFX.bump(); }
  } else SFX.bump();
  if (bumped) bumps.push({ tx, ty, t: 0 });
  // things standing on top get knocked
  const top = ty * T, l = tx * T, r = l + T;
  for (const e of enemies) {
    if (e.state !== 'dead' && e.x + e.w > l && e.x < r && Math.abs(e.y + e.h - top) < 4) {
      knock(e, e.x + e.w / 2 < l + 8 ? -1 : 1); addScore(100, e.x, e.y);
    }
  }
  for (const it of items) {
    if (!it.emerge && it.x + it.w > l && it.x < r && Math.abs(it.y + it.h - top) < 4) {
      it.vy = -4; if (it.vx) it.vx = (it.x + it.w / 2 < l + 8) ? -1 : 1;
    }
  }
  // coins above the block aren't in 1-1, nothing else to do
}

function giveContent(what, tx, ty) {
  const x = tx * T, y = ty * T;
  if (what === 'prize') {
    game.prize = 1; SFX.power(); setTimeout(SFX.clear, 600);
    for (let i = 0; i < 6; i++) coinPops.push({ x: x + 4 + (i - 2.5) * 10, y: y - 14, vy: -5 - (i % 3), t: 0, quiet: true });
    return;
  }
  if (what === 'coin') { coinPops.push({ x: x + 4, y: y - 14, vy: -5, t: 0 }); addCoin(); return; }
  let type = what;
  if (what === 'power') type = M.power === 0 ? 'mushroom' : 'flower';
  items.push({ type, x, y, w: 16, h: 16, vx: 0, vy: 0, emerge: 16 });
  SFX.sprout();
}

function powerUp(it) {
  const m = M;
  if (it.type === '1up') { oneUp(it.x, it.y); return; }
  addScore(1000, it.x, it.y);
  if (it.type === 'star') { m.star = 660; SFX.power(); return; }
  SFX.power();
  if (m.power === 0) { m.power = 1; m.crouch = false; setH(32); freeze('grow', 60); }
  else if (it.type === 'flower' && m.power === 1) { m.power = 2; freeze('fire', 40); }
}

// ---------------------------------------------------------------- enemies
function spawnEnemies() {
  while (spawnIdx < SPAWNS.length && SPAWNS[spawnIdx][0] * T < camX + W + 16) {
    const [tx, ty, type] = SPAWNS[spawnIdx++];
    if (type === 'goomba') enemies.push({ type, x: tx * T + 1, y: ty * T, w: 14, h: 16, vx: -0.5, vy: 0, state: 'walk', t: 0 });
    else enemies.push({ type, x: tx * T + 1, y: ty * T, w: 14, h: 16, vx: -0.5, vy: 0, state: 'walk', t: 0 });
  }
}
function knock(e, dir) {
  e.state = 'dead'; e.vy = -3.5; e.vx = dir * 0.8; e.t = 0; SFX.kick();
}
const STOMP = [100, 200, 400, 500, 800, 1000, 2000, 4000, 5000, 8000];
function stompScore(e) {
  if (M.combo < STOMP.length) addScore(STOMP[M.combo], e.x, e.y); else oneUp(e.x, e.y);
  M.combo++;
}
function updateEnemies() {
  for (const e of enemies) {
    e.t++;
    if (e.state === 'dead') { e.vy += 0.3; e.x += e.vx; e.y += e.vy; continue; }
    if (e.state === 'flat') continue;
    if (e.type === 'shell' && e.vx === 0) {
      e.idle++;
      if (e.idle > 420) { e.type = 'koopa'; e.vx = M.x < e.x ? -0.5 : 0.5; }
    }
    if (e.kickGrace > 0) e.kickGrace--;
    e.vy = Math.min(e.vy + 0.3, 5);
    if (physX(e)) { e.vx = -e.vx; if (e.type === 'shell' && Math.abs(e.x - camX) < W) SFX.bump(); }
    physY(e);
  }
  // enemy vs enemy
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i]; if (a.state !== 'walk') continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j]; if (b.state !== 'walk' || !overlap(a, b)) continue;
      const aShell = a.type === 'shell' && a.vx !== 0, bShell = b.type === 'shell' && b.vx !== 0;
      if (aShell && !bShell) { knock(b, Math.sign(a.vx)); shellCombo(a, b); }
      else if (bShell && !aShell) { knock(a, Math.sign(b.vx)); shellCombo(b, a); }
      else if (aShell && bShell) { knock(a, 1); knock(b, -1); }
      else {
        if ((a.x < b.x && a.vx > 0) || (a.x > b.x && a.vx < 0)) a.vx = -a.vx;
        if ((b.x < a.x && b.vx > 0) || (b.x > a.x && b.vx < 0)) b.vx = -b.vx;
      }
    }
  }
  // enemy vs mario
  if (M.state === 'normal') {
    for (const e of enemies) {
      if (e.state !== 'walk' || !overlap(M, e)) continue;
      if (M.star > 0) { knock(e, M.vx >= 0 ? 1 : -1); addScore(200, e.x, e.y); continue; }
      const fromAbove = M.vy > 0 && M.prevY + M.h <= e.y + 6;
      if (e.type === 'shell' && e.vx === 0) {
        e.vx = (M.x + M.w / 2 < e.x + e.w / 2) ? 4 : -4; e.kickGrace = 12; e.combo = 0;
        addScore(400, e.x, e.y); SFX.kick();
        if (fromAbove) { M.vy = -3.5; M.y = e.y - M.h; }
        continue;
      }
      if (fromAbove) {
        if (e.type === 'goomba') { e.state = 'flat'; e.t = 0; }
        else if (e.type === 'koopa') { e.type = 'shell'; e.vx = 0; e.idle = 0; }
        else if (e.type === 'shell') { e.vx = 0; e.idle = 0; }
        stompScore(e); SFX.stomp();
        M.y = e.y - M.h; M.vy = input.jump ? -5 : -3.5; M.jumping = input.jump;
      } else if (!(e.type === 'shell' && e.kickGrace > 0)) hurt();
    }
  }
  enemies = enemies.filter(e => !(e.y > H + 32 || e.x < camX - 64 || e.x > camX + W + 320 ||
                                  (e.state === 'flat' && e.t > 30)));
}
function shellCombo(shell, victim) {
  const pts = [500, 800, 1000, 2000, 4000, 5000, 8000];
  shell.combo = shell.combo || 0;
  if (shell.combo < pts.length) addScore(pts[shell.combo], victim.x, victim.y); else oneUp(victim.x, victim.y);
  shell.combo++;
}

// ---------------------------------------------------------------- items / fx
function updateItems() {
  for (const it of items) {
    if (it.emerge > 0) {
      it.y -= 0.5; it.emerge -= 0.5;
      if (it.emerge <= 0) {
        it.emerge = 0;
        if (it.type === 'mushroom' || it.type === '1up') it.vx = 1;
        if (it.type === 'star') { it.vx = 1; it.vy = -4; }
      }
    } else if (it.type !== 'flower') {
      it.vy = Math.min(it.vy + (it.type === 'star' ? 0.2 : 0.3), 5);
      if (physX(it)) it.vx = -it.vx;
      physY(it);
      if (it.type === 'star' && it.onGround) it.vy = -4.5;
    }
    if (M.state === 'normal' && it.emerge < 8 && overlap(M, it)) { it.dead = true; powerUp(it); }
  }
  items = items.filter(it => !it.dead && it.y < H + 16 && it.x > camX - 32);
}
function updateFireballs() {
  for (const f of fireballs) {
    f.t++;
    f.vy = Math.min(f.vy + 0.4, 5);
    if (physX(f)) { f.dead = true; SFX.bump(); }
    physY(f);
    if (f.onGround) f.vy = -3.5;
    for (const e of enemies) {
      if (e.state === 'walk' && overlap(f, e)) { knock(e, Math.sign(f.vx)); addScore(200, e.x, e.y); f.dead = true; break; }
    }
    if (f.x < camX - 8 || f.x > camX + W || f.y > H) f.dead = true;
    if (f.dead) parts.push({ x: f.x, y: f.y, puff: true, t: 0 });
  }
  fireballs = fireballs.filter(f => !f.dead);
}
function updateFx() {
  for (const p of parts) {
    if (p.puff) { p.t++; continue; }
    p.vy += 0.3; p.x += p.vx; p.y += p.vy;
  }
  parts = parts.filter(p => p.puff ? p.t < 12 : p.y < H + 16);
  for (const c of coinPops) {
    c.t++; c.vy += 0.35; c.y += c.vy;
    if (c.t === 28 && !c.quiet) pops.push({ x: c.x - 4, y: c.y, text: '200', t: 0 });
  }
  coinPops = coinPops.filter(c => c.t < 28);
  for (const p of pops) p.t++;
  pops = pops.filter(p => p.t < 50);
  for (const b of bumps) b.t++;
  bumps = bumps.filter(b => b.t < 10);
}

// ---------------------------------------------------------------- main step
function updatePlay() {
  if (game.room && game.prize) {
    game.prize++;
    if (game.prize === 240) {
      document.getElementById('bannerName').textContent = 'CONGRATS ' + CH().title;
      document.getElementById('prize').classList.add('show');
    }
  }
  if (game.room && game.prize > 60 && (input.startP || input.tapP || prizeTap)) { startIntro(); return; }
  if (input.startP && M.state === 'normal') { game.paused = !game.paused; SFX.pause(); }
  if (game.paused) return;
  if (game.freeze > 0) { game.freeze--; return; }
  if (M.state === 'dead') { updateMario(); return; }
  if (M.state === 'normal' && !game.room) {
    if (++game.tick % 24 === 0 && game.time > 0) {
      game.time--;
      if (game.time === 100) seq([1047, 0, 1047, 0, 1047], .08, { vol: .04 });
      if (game.time === 0) { die(false); return; }
    }
  }
  updateMario();
  if (M.state === 'dead') return;
  spawnEnemies();
  updateEnemies();
  updateItems();
  updateFireballs();
  updateFx();
  if (!game.room && (M.state === 'normal' || M.state === 'walk')) {
    if (M.x - camX > 112) camX = M.x - 112;
    camX = Math.min(camX, LW * T - W);
  }
}
function step() {
  if (locked) return;
  readInput();
  game.frame++;
  switch (game.state) {
    case 'title':
      if (input.startP || input.jumpP || input.tapP) { audio(); game.state = 'select'; SFX.coin(); }
      break;
    case 'select': {
      const pick = i => { if (i !== game.char) { game.char = i; SFX.kick(); } };
      if (input.leftP) pick((game.char + CHARS.length - 1) % CHARS.length);
      if (input.rightP) pick((game.char + 1) % CHARS.length);
      let go = input.startP || input.jumpP;
      if (input.tapP && tapY > 56 && tapY < 176) {
        const i = Math.max(0, Math.min(CHARS.length - 1, Math.floor(tapX / 64)));
        if (i === game.char) go = true; else pick(i);
      } else if (input.tapP && tapY >= 176) go = true;
      if (go) { SFX.power(); newGame(); }
      break;
    }
    case 'intro':
      if (--game.timer <= 0) { resetLevel(); game.state = 'play'; }
      break;
    case 'play': updatePlay(); break;
    case 'gameover':
      if (--game.timer <= 0 || (game.timer < 240 && (input.startP || input.tapP))) { game.state = 'title'; resetLevel(); }
      break;
  }
  endInput();
}

// ---------------------------------------------------------------- rendering
function text(s, x, y, color = '#fcfcfc', align = 'left') {
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.font = '8px "Press Start 2P", monospace';
  ctx.fillText(s, x, y);
}
function drawHUD() {
  text(CH().name, 24, 16);

  const cf = [0, 0, 0, 1, 2, 1][Math.floor(game.frame / 8) % 6];

  ctx.fillRect(90, 24, 4, 8); ctx.fillRect(89, 25, 6, 6);

}

function puffs(x, yBottom, n, fill, line) {
  // clouds and bushes share a shape (just like the original!)
  const shapes = [];
  shapes.push([x + 8, yBottom - 8, 8]);
  for (let i = 0; i < n; i++) shapes.push([x + 16 + i * 16, yBottom - 12, 11]);
  shapes.push([x + 16 + n * 16, yBottom - 8, 8]);
  ctx.fillStyle = line;
  for (const [cx, cy, r] of shapes) { ctx.beginPath(); ctx.arc(cx, cy, r + 1, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillRect(x - 1, yBottom - 9, (n + 1) * 16 + 18, 9);
  ctx.fillStyle = fill;
  for (const [cx, cy, r] of shapes) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillRect(x, yBottom - 8, (n + 1) * 16 + 16, 8);
}
function hill(x, w, h) {
  const g = 13 * T, cx = x + w / 2;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.moveTo(x - 1, g);
  ctx.lineTo(cx - 9, g - h + 6); ctx.quadraticCurveTo(cx, g - h - 4, cx + 9, g - h + 6); ctx.lineTo(x + w + 1, g); ctx.fill();
  ctx.fillStyle = '#00a800';
  ctx.beginPath(); ctx.moveTo(x + 1, g);
  ctx.lineTo(cx - 8, g - h + 7); ctx.quadraticCurveTo(cx, g - h - 2, cx + 8, g - h + 7); ctx.lineTo(x + w - 1, g); ctx.fill();
  ctx.fillStyle = '#005000';
  const spots = w > 60 ? [[-14, 10], [6, 16], [-4, 24]] : [[-4, 8]];
  for (const [dx, dy] of spots) {
    if (dy > h - 4) continue;
    ctx.fillRect(cx + dx, g - h + dy, 3, 6); ctx.fillRect(cx + dx + 6, g - h + dy, 3, 6);
  }
}
function drawDecor(cx) {
  for (let k = 0; k < 5; k++) {
    const o = k * 48 * T - cx;
    if (o > W || o + 48 * T < 0) continue;
    hill(o, 80, 35); hill(o + 16 * T, 48, 19);
    puffs(o + 11 * T, 13 * T, 3, '#80d010', '#005000');
    puffs(o + 23 * T, 13 * T, 1, '#80d010', '#005000');
    puffs(o + 41 * T, 13 * T, 2, '#80d010', '#005000');
    puffs(o + 8 * T, 3 * T + 24, 1, '#fcfcfc', '#000');
    puffs(o + 19 * T, 2 * T + 24, 3, '#fcfcfc', '#000');
    puffs(o + 27 * T, 3 * T + 24, 2, '#fcfcfc', '#000');
    puffs(o + 36 * T, 2 * T + 24, 1, '#fcfcfc', '#000');
  }
}
function pipeTop(x, y) {
  ctx.fillStyle = '#000'; ctx.fillRect(x, y, 32, 16);

  ctx.fillStyle = '#80d010'; ctx.fillRect(x + 3, y + 1, 2, 14); ctx.fillRect(x + 7, y + 1, 8, 14);
  ctx.fillStyle = '#005000'; ctx.fillRect(x + 23, y + 1, 2, 14); ctx.fillRect(x + 27, y + 1, 3, 14);
}
function pipeBody(x, y) {

  ctx.fillStyle = '#00a800'; ctx.fillRect(x + 3, y, 26, 16);
  ctx.fillStyle = '#80d010'; ctx.fillRect(x + 5, y, 2, 16); ctx.fillRect(x + 9, y, 7, 16);

}
function drawTiles(cx) {
  const q = 'q' + [0, 0, 0, 1, 2, 1][Math.floor(game.frame / 8) % 6];
  const t0 = Math.floor(cx / T) - 1, t1 = t0 + 18;
  for (let ty = 0; ty < LH; ty++) for (let tx = t0; tx <= t1; tx++) {
    const c = tileAt(tx, ty); if (c === ' ' || c === 'H') continue;
    let sx = tx * T - cx, sy = ty * T;
    const b = bumps.find(b => b.tx === tx && b.ty === ty);
    if (b) sy -= Math.round(Math.sin(b.t / 10 * Math.PI) * 5);

      case 'X': ctx.drawImage(spr(game.room ? 'brick' : 'ground', game.room ? 'tileU' : 'tile'), sx, sy); break;
      case 'B': ctx.drawImage(spr('brick', 'tile'), sx, sy); break;

      case 'U': ctx.drawImage(spr('used', 'tile'), sx, sy); break;

      case 'p': pipeTop(sx, sy); break;

}
function drawFlag(cx) {

  ctx.fillStyle = '#00a800'; ctx.beginPath(); ctx.arc(px, POLE_TOP - 3, 3.5, 0, Math.PI * 2); ctx.fill();

}
function drawCastle(cx) {

function drawItems(cx) {

      // clip to the area above the block it's coming out of
      const visible = 16 - it.emerge;
      ctx.drawImage(img, 0, 0, 16, visible, Math.round(it.x - cx), Math.round(it.y), 16, visible);
    } else draw(img, it.x - cx, it.y);
  }
}
function drawEnemies(cx) {
  for (const e of enemies) {
    const x = e.x - cx - 1;
    if (x < -24 || x > W + 8) continue;
    const dead = e.state === 'dead';
    if (e.type === 'goomba') {
      if (e.state === 'flat') draw(spr('goomba_flat', 'goomba'), x, e.y + e.h - 8);
      else draw(spr('goomba', 'goomba'), x, e.y, !dead && (Math.floor(game.frame / 10) & 1) === 1, dead);
    } else if (e.type === 'koopa' && !dead) {
      const f = Math.floor(game.frame / 10) & 1 ? 'koopa1' : 'koopa2';
      draw(spr(f, 'koopa'), x, e.y + e.h - 24, e.vx < 0);
    } else {
      const shake = e.type === 'shell' && e.vx === 0 && e.idle > 360 ? ((game.frame >> 1) & 1) : 0;
      draw(spr('shell', 'koopa'), x + shake, e.y, false, dead);
    }
  }
}
function drawMario(cx) {
  const m = M;
  if (!m || m.hidden) return;
  if (game.state !== 'play') return;
  if (m.invuln > 0 && game.freeze === 0 && (game.frame >> 1) & 1) return;
  let big = m.power > 0, pal = m.power === 2 ? 'fire' : 'mario';
  if (game.freeze > 0) {
    const alt = (game.freeze >> 2) & 1;
    if (game.freezeType === 'grow' || game.freezeType === 'shrink') big = alt ? !big : big;
    if (game.freezeType === 'fire') pal = alt ? 'mario' : 'fire';
  }
  if (m.star > 0) {
    const cyc = ['mario', 'starA', 'starB', 'fire'];
    pal = cyc[Math.floor(game.frame / (m.star < 120 ? 6 : 2)) % 4];
  }
  let name;
  if (m.state === 'dead') name = 's_dead';
  else {
    const pre = big ? 'b_' : 's_';
    if (big && m.crouch) name = 'b_crouch';
    else if (m.state === 'flag') name = pre + (m.flipT ? 'stand' : 'jump');
    else if (!m.onGround && m.state === 'normal') name = pre + 'jump';
    else if (m.vx !== 0) name = pre + ['walk1', 'walk2', 'stand'][Math.floor(m.anim) % 3];
    else name = pre + 'stand';
    if (m.skid) name = pre + 'walk2';
  }
  const img = spr(CH().id + '_' + name, CH().id + '_' + pal);
  // during grow/shrink the hitbox is the final size; anchor sprite to feet
  draw(img, m.x - cx - 2, m.y + m.h - img.height, m.facing < 0);
}
function drawFireballs(cx) {
  for (const f of fireballs) draw(spr('fireball', 'ball'), f.x - cx, f.y, false, (f.t >> 2) & 1);
}
function drawFx(cx) {
  for (const p of parts) {
    if (p.puff) {
      ctx.fillStyle = p.t & 2 ? '#fca044' : '#fcfcfc';
      const r = 2 + p.t / 2; ctx.fillRect(Math.round(p.x - cx + 4 - r), Math.round(p.y + 4 - r), r * 2, r * 2);
      continue;
    }
    const x = Math.round(p.x - cx), y = Math.round(p.y);
    ctx.fillStyle = '#000'; ctx.fillRect(x, y, 8, 8);
    ctx.fillStyle = '#c84c0c'; ctx.fillRect(x + 1, y + 1, 6, 6);
    ctx.fillStyle = '#fcbcb0'; ctx.fillRect(x + 1, y + 1, 6, 1);
  }
  for (const c of coinPops) {
    draw(spr(Math.floor(c.t / 3) % 2 ? 'coin_edge' : 'coin', 'coin'), c.x - cx, c.y);
  }
  for (const p of pops) {
    ctx.save(); ctx.font = '8px "Press Start 2P", monospace'; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
    ctx.fillStyle = '#fcfcfc'; ctx.globalAlpha = p.t > 40 ? (50 - p.t) / 10 : 1;
    ctx.fillText(p.text, Math.round(p.x - cx), Math.round(p.y - p.t * 0.6));
    ctx.restore();
  }
}
function drawWorld() {
  const cx = Math.round(camX);
  ctx.fillStyle = game.room ? '#000' : '#5c94fc'; ctx.fillRect(0, 0, W, H);
  if (!game.room) drawDecor(cx);
  drawItems(cx);
  drawFlag(cx);
  drawCastle(cx);
  drawTiles(cx);
  drawEnemies(cx);
  drawFireballs(cx);
  drawMario(cx);
  drawFx(cx);
}
function render() {
  if (game.state === 'intro' || game.state === 'gameover') {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    drawHUD();
    if (game.state === 'intro') {
      text('WORLD 1-1', 128, 80, '#fcfcfc', 'center');
      ctx.drawImage(spr(CH().id + '_s_stand', CH().id + '_mario'), 96, 108);
      text('×  ' + game.lives, 122, 112);
    } else text('GAME OVER', 128, 112, '#fcfcfc', 'center');
    return;
  }
  drawWorld();
  drawHUD();
  if (game.state === 'select') {
    ctx.fillStyle = 'rgba(0,0,0,.78)'; ctx.fillRect(0, 36, W, H - 36);
    text('SELECT YOUR PLAYER', 128, 46, '#fcfcfc', 'center');
    CHARS.forEach((c, i) => {
      const sel = i === game.char, x = i * 64 + 16, y = 72;
      if (sel) {
        ctx.fillStyle = (game.frame >> 3) & 1 ? '#fc9838' : '#c84c0c';
        ctx.fillRect(x - 6, y - 6, 44, 76); ctx.fillStyle = '#000'; ctx.fillRect(x - 4, y - 4, 40, 72);
      }
      const f = sel ? ['stand', 'walk1', 'walk2'][Math.floor(game.frame / 8) % 3] : 'stand';
      ctx.drawImage(spr(c.id + '_b_' + f, c.id + '_mario'), x, y, 32, 64);
      text(c.name, i * 64 + 32, 152, sel ? '#fc9838' : '#fcfcfc', 'center');
    });
    const touch = matchMedia('(pointer:coarse)').matches;
    if ((game.frame >> 4) & 1) text(touch ? 'TAP TO CHOOSE, TAP AGAIN' : '\u2190 \u2192 CHOOSE   ENTER START', 128, 204, '#fcfcfc', 'center');
    if (touch && (game.frame >> 4) & 1) text('TO START', 128, 216, '#fcfcfc', 'center');
  } else if (game.state === 'title') {
    ctx.fillStyle = '#000'; ctx.fillRect(38, 46, 180, 92);
    ctx.fillStyle = '#c84c0c'; ctx.fillRect(40, 48, 176, 88);
    ctx.fillStyle = '#fcbcb0'; ctx.fillRect(40, 48, 176, 2); ctx.fillRect(40, 48, 2, 88);
    ctx.fillStyle = '#000'; ctx.fillRect(40, 134, 176, 2); ctx.fillRect(214, 48, 2, 88);
    ctx.save(); ctx.font = '16px "Press Start 2P", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#000'; ctx.fillText('SUPER', 129, 61); ctx.fillText('MARIO BROS.', 129, 85);
    ctx.fillStyle = '#fcbcb0'; ctx.fillText('SUPER', 128, 60); ctx.fillText('MARIO BROS.', 128, 84);
    ctx.restore();
    text('WORLD 1-1 TRIBUTE', 128, 114, '#fcbcb0', 'center');
    const touch = matchMedia('(pointer:coarse)').matches;
    if ((game.frame >> 5) & 1 || true) text(touch ? 'TAP  A  TO START' : 'PRESS ENTER', 128, 150, (game.frame >> 4) & 1 ? '#fcfcfc' : '#fcbcb0', 'center');
    text('TOP- ' + String(game.hi).padStart(6, '0'), 128, 166, '#fcfcfc', 'center');
    if (!touch) {
      text('ARROWS MOVE  Z RUN/FIRE', 128, 186, '#fcfcfc', 'center');
      text('X / SPACE JUMP  M MUTE', 128, 198, '#fcfcfc', 'center');
    }
  } else if (game.paused) {
    text('PAUSE', 128, 100, '#fcfcfc', 'center');
  } else if (M && M.state === 'done') {
    text('COURSE CLEAR!', 128, 72, '#fcfcfc', 'center');
    const touch = matchMedia('(pointer:coarse)').matches;
    if ((game.frame >> 4) & 1) {
      text(touch ? 'TAP A TO CLAIM' : 'HIT SPACE BAR TO CLAIM', 128, 96, '#fcfcfc', 'center');
      text('YOUR PRIZE', 128, 108, '#fcfcfc', 'center');
    }
  } else if (game.room && game.prize) {
    const a = Math.min(1, game.prize / 30);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = '#fcfcfc'; ctx.fillRect(14, 66, 228, 60);
    ctx.fillStyle = '#c84c0c'; ctx.fillRect(16, 68, 224, 56);
    ctx.restore();
    if (game.prize > 20) {
      const gold = (game.frame >> 3) & 1 ? '#fc9838' : '#fcfcfc';
      text('CONGRATS ' + CH().title, 128, 78, gold, 'center');
      text('NEXT LEVEL COMING', 128, 96, '#fcfcfc', 'center');
      text('MAY 2027', 128, 108, '#fcfcfc', 'center');
    }
    if (game.prize > 60 && (game.frame >> 4) & 1)
      text(matchMedia('(pointer:coarse)').matches ? 'TAP SCREEN TO PLAY AGAIN' : 'ENTER TO PLAY AGAIN', 128, 220, '#fcbcb0', 'center');
  }
}

// ---------------------------------------------------------------- loop
resetLevel();
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(t) {
  acc += Math.min(100, t - last); last = t;
  while (acc >= STEP) { step(); acc -= STEP; }
  render();
  requestAnimationFrame(loop);
}
(document.fonts && document.fonts.load ? document.fonts.load('8px "Press Start 2P"').catch(() => {}) : Promise.resolve())
  .finally(() => requestAnimationFrame(t => { last = t; loop(t); }));
</script>
</body>
</html>
